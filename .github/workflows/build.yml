name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            echo "Xcode 15.4 not found, using default Xcode"
            xcode-select -p
          fi
          xcodebuild -version

      - name: Install Tools
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive (Unsigned / Direct Package)
        run: |
          xcodebuild archive \
            -project StrmAction.xcodeproj \
            -scheme StrmAction \
            -destination 'generic/platform=iOS' \
            -archivePath "build/StrmAction.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/StrmAction.xcarchive/Products/Applications/StrmAction.app" Payload/
          zip -r -q StrmAction.ipa Payload
          rm -rf Payload
          ls -lh StrmAction.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrmAction-iOS-IPA
          path: StrmAction.ipa
          retention-days: 14

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StrmAction.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
